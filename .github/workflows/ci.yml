name: CI

# Item 6 do pedido do usuário: nenhum recurso, correção ou ajuste deve
# depender de alguém lembrar de testar manualmente o celular ou o desktop.
# Este workflow roda em todo push e pull request e barra o merge se algo
# quebrar em qualquer um dos dois formatos.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Checagem de tipos e build
        run: npm run build

      - name: Testes unitários
        run: npm run test

      - name: Auditoria de contraste (WCAG)
        run: npm run check:contrast

      - name: Instala navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end (desktop + mobile)
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
