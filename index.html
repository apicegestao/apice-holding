<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F9" />
    <!--
      CSP via <meta> de propósito, não no config do host: assim ela viaja
      junto com os arquivos estáticos pra qualquer lugar que sirva este
      build, sem depender de configuração específica do Netlify (ou de
      quem quer que venha depois dele). 'unsafe-inline' em style-src é
      necessário porque o sistema usa cor dinâmica (empresa, KPI, nó do
      mapa mental) via atributo style — nunca script inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://hhlxazpqonkfcgrcmzpp.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Ápice Holding</title>
    <link rel="icon" href="/favicon.svg?v=f65b94fe" type="image/svg+xml" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
